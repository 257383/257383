<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Sylwetka miasta pod zadymionym niebem">
  <defs>
    <linearGradient id="niebo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9a9d"/>
      <stop offset="1" stop-color="#dbe7e0"/>
    </linearGradient>
  </defs>

  <!-- niebo -->
  <rect width="1200" height="300" fill="url(#niebo)"/>
  <circle cx="1010" cy="85" r="42" fill="#f4f0da" opacity="0.65"/>

  <!-- dym -->
  <g fill="#6f7b7e" opacity="0.35">
    <ellipse cx="210" cy="95" rx="70" ry="22"/>
    <ellipse cx="260" cy="70" rx="90" ry="26"/>
    <ellipse cx="640" cy="105" rx="80" ry="24"/>
    <ellipse cx="700" cy="78" rx="100" ry="28"/>
    <ellipse cx="930" cy="150" rx="60" ry="18"/>
  </g>

  <!-- budynki -->
  <g fill="#2f4a3b">
    <rect x="0"   y="190" width="90"  height="110"/>
    <rect x="100" y="150" width="70"  height="150"/>
    <rect x="180" y="175" width="110" height="125"/>
    <rect x="300" y="130" width="80"  height="170"/>
    <rect x="390" y="185" width="100" height="115"/>
    <rect x="500" y="160" width="75"  height="140"/>
    <rect x="585" y="195" width="120" height="105"/>
    <rect x="715" y="140" width="85"  height="160"/>
    <rect x="810" y="180" width="105" height="120"/>
    <rect x="925" y="155" width="80"  height="145"/>
    <rect x="1015" y="190" width="95" height="110"/>
    <rect x="1120" y="165" width="80" height="135"/>
    <!-- kominy -->
    <rect x="215" y="120" width="14" height="55"/>
    <rect x="645" y="130" width="14" height="65"/>
  </g>

  <!-- zieleń na pierwszym planie -->
  <rect x="0" y="270" width="1200" height="30" fill="#4f7a5a"/>
</svg>
